<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeCharm - grass companion</title>
<style>
:root {
  --ink:#1d3326; --muted:#6f8b72; --card:#ffffff; --line:#d8e8d4;
  --accent:#5aa832; --bg:#f2faee;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #eef9e6 55%, #dcefd2 100%);
  display:flex; flex-direction:column; align-items:center; padding:34px 20px 56px;
}
header { text-align:center; }
h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.02em; }
header p { margin:0; color:var(--muted); font-size:14px; }
.stage {
  position:relative; margin:24px 0 8px; width:430px; height:360px;
  display:flex; align-items:flex-end; justify-content:center;
  background:linear-gradient(180deg,#ffffff 0%,#f6fcf0 60%,#e6f4d9 100%);
  border:1px solid var(--line); border-radius:24px;
  box-shadow:0 26px 54px -34px rgba(50,110,30,.5), inset 0 1px 0 #fff;
  overflow:hidden;
}
.stage::after {
  content:""; position:absolute; left:0; right:0; bottom:0; height:90px;
  background:linear-gradient(180deg, rgba(90,168,50,0) 0%, rgba(90,168,50,.10) 100%);
  pointer-events:none;
}
.pet-wrap { transform-origin:bottom center; margin-bottom:16px; cursor:pointer; }
.state { position:absolute; top:14px; left:16px; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); }
.state b { color:var(--ink); letter-spacing:.02em; text-transform:none; font-size:13px; }
.hint { color:var(--muted); font-size:13px; margin:4px 0 18px; text-align:center; }
.row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:620px; }
.row + .row { margin-top:10px; }
button { font:inherit; font-size:13px; padding:9px 15px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  transition:transform .08s ease, background .15s ease, border-color .15s ease; }
button:hover { border-color:#c3dcb8; }
button:active { transform:translateY(1px); }
button.on { background:var(--ink); border-color:var(--ink); color:#eaf8ff; }
.label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  align-self:center; margin-right:4px; }
.drop { position:absolute; border-radius:50%; pointer-events:none; animation:rise 900ms ease-out forwards; }
@keyframes rise {
  0%   { opacity:1; transform:translateY(0) scale(.6); }
  100% { opacity:0; transform:translateY(-76px) scale(1.1); }
}
footer { margin-top:30px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; max-width:640px; }
code { background:#fff; border:1px solid var(--line); border-radius:6px; padding:1px 5px; font-size:11.5px; }

  background-position: 0 0;

  image-rendering: pixelated;
  image-rendering: crisp-edges;
  will-change: background-position;
}

/* scale the pet without touching the pixel grid */
.wpet-stage { display: inline-block; transform-origin: bottom center; }
.wpet-stage--sm  { transform: scale(0.75); }
.wpet-stage--lg  { transform: scale(1.5); }
.wpet-stage--xl  { transform: scale(2); }

/* jump / attack / hurt / happy are one-shots: switch back to
   .wpet--idle on the animationend event (see the demo). */

.wpet--idle { animation: wpet-idle 1144ms steps(8, end) infinite; }

.wpet--walk { animation: wpet-walk 800ms steps(8, end) infinite; }

.wpet--run { animation: wpet-run 568ms steps(8, end) infinite; }

.wpet--jump { animation: wpet-jump 664ms steps(8, end) 1; }

.wpet--attack { animation: wpet-attack 616ms steps(8, end) 1; }

.wpet--hurt { animation: wpet-hurt 728ms steps(8, end) 1; }

.wpet--sleep { animation: wpet-sleep 2000ms steps(8, end) infinite; }

.wpet--happy { animation: wpet-happy 888ms steps(8, end) 1; }

@keyframes wpet-idle {
  from { background-position: 0 0px; }
  to   { background-position: -2400px 0px; }
}

@keyframes wpet-walk {
  from { background-position: 0 -240px; }
  to   { background-position: -2400px -240px; }
}

@keyframes wpet-run {
  from { background-position: 0 -480px; }
  to   { background-position: -2400px -480px; }
}

@keyframes wpet-jump {
  from { background-position: 0 -720px; }
  to   { background-position: -2400px -720px; }
}

@keyframes wpet-attack {
  from { background-position: 0 -960px; }
  to   { background-position: -2400px -960px; }
}

@keyframes wpet-hurt {
  from { background-position: 0 -1200px; }
  to   { background-position: -2400px -1200px; }
}

@keyframes wpet-sleep {
  from { background-position: 0 -1440px; }
  to   { background-position: -2400px -1440px; }
}

@keyframes wpet-happy {
  from { background-position: 0 -1680px; }
  to   { background-position: -2400px -1680px; }
}


@media (prefers-reduced-motion: reduce) {
  .wpet { animation: none !important; background-position: 0 0; }
}

</style>
</head>
<body>
<header>
  <h1>PokeCharm &middot; grass companion</h1>
  <p>Eight animations, one sheet. Every frame is 300&times;240 and clips cleanly.</p>
</header>

<div class="stage">
  <div class="state">state <b id="label">idle</b></div>
  <div class="pet-wrap" id="wrap"><div class="wpet wpet--idle" id="pet"></div></div>
</div>
<p class="hint">Press <b>1</b>-<b>8</b> for an animation &middot; <b>space</b> to pet &middot; <b>V</b> for the vine whip</p>

<div class="row" id="buttons"></div>
<div class="row" id="sizes"><span class="label">size</span></div>

<footer>
  Sheet <code>moss-sheet.png</code> &mdash; 2400&times;1920, 8&times;8 frames of 300&times;240,
  anchor (150,&nbsp;209). Styles <code>moss.css</code>, data <code>moss-atlas.json</code>.
</footer>

<script>
const NAMES = ["idle", "walk", "run", "jump", "attack", "hurt", "sleep", "happy"];
const ONESHOT = ["jump", "attack", "hurt", "happy"];
const pet = document.getElementById('pet');
const label = document.getElementById('label');
const wrap = document.getElementById('wrap');
const buttons = document.getElementById('buttons');
const sizes = document.getElementById('sizes');
const stage = document.querySelector('.stage');
let current = 'idle';
wrap.style.transform = 'scale(1.5)';

function play(name) {
  current = name;
  pet.className = 'wpet wpet--' + name;
  label.textContent = name;
  [...buttons.children].forEach(b => b.classList.toggle('on', b.dataset.name === name));
}
pet.addEventListener('animationend', () => { if (ONESHOT.includes(current)) play('idle'); });

NAMES.forEach((n, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + '. ' + n;
  b.dataset.name = n;
  b.onclick = () => play(n);
  buttons.appendChild(b);
});

[['1x', 1], ['1.5x', 1.5], ['2x', 2], ['2.5x', 2.5]].forEach(([txt, k], i) => {
  const b = document.createElement('button');
  b.textContent = txt;
  b.onclick = () => {
    wrap.style.transform = 'scale(' + k + ')';
    [...sizes.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b));
  };
  if (k === 1.5) b.classList.add('on');
  sizes.appendChild(b);
});

function petIt() {
  play('happy');
  for (let i = 0; i < 6; i++) {
    const e = document.createElement('div');
    e.className = 'drop';
    const s = 5 + Math.random() * 6;
    e.style.width = s + 'px'; e.style.height = s + 'px';
    e.style.left = (150 + Math.random() * 130) + 'px';
    e.style.top = (220 + Math.random() * 60) + 'px';
    e.style.background = i % 3 ? 'rgba(150,210,110,.9)' : 'rgba(255,255,255,.95)';
    e.style.border = '1px solid rgba(30,110,160,.45)';
    e.style.animationDelay = (i * 70) + 'ms';
    stage.appendChild(e);
    setTimeout(() => e.remove(), 1200 + i * 70);
  }
}
wrap.addEventListener('click', petIt);
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); petIt(); }
  if (e.key.toLowerCase() === 'v') play('attack');
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 8) play(NAMES[n - 1]);
});
play('idle');
</script>
</body>
