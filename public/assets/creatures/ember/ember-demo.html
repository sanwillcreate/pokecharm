<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeCharm - fire pet</title>
<style>
:root {
  --ink:#2a1c12; --muted:#8d7767; --card:#fffdf9; --line:#ecdfd0;
  --accent:#e2622a; --bg:#f9f3ea;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #fffaf2 0%, #f7eee0 55%, #efe1cf 100%);
  display:flex; flex-direction:column; align-items:center; padding:36px 20px 56px;
}
header { text-align:center; }
h1 { font-size:26px; margin:0 0 6px; letter-spacing:-.02em; }
header p { margin:0; color:var(--muted); font-size:14px; }
.stage {
  position:relative; margin:26px 0 10px; width:430px; height:360px;
  display:flex; align-items:flex-end; justify-content:flex-end;
  background:linear-gradient(180deg,#fffdf8 0%,#fdf4e6 62%,#f6e7d2 100%);
  border:1px solid var(--line); border-radius:26px;
  box-shadow:0 26px 54px -32px rgba(120,70,20,.6), inset 0 1px 0 #fff;
  overflow:hidden;
}
.stage::after {
  content:""; position:absolute; left:0; right:0; bottom:0; height:96px;
  background:linear-gradient(180deg, rgba(226,98,42,0) 0%, rgba(226,98,42,.10) 100%);
  pointer-events:none;
}
.pet-wrap { transform:scale(1.15); transform-origin:bottom right; margin:0 26px 4px 0; cursor:pointer; }
.pet-wrap:active { transform:scale(1.1); }
.state { position:absolute; top:14px; left:16px; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); }
.state b { color:var(--ink); letter-spacing:.02em; text-transform:none; font-size:13px; }
.hint { color:var(--muted); font-size:13px; margin:2px 0 22px; }
.row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:600px; }
button { font:inherit; font-size:13px; padding:9px 15px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  transition:transform .08s ease, background .15s ease, border-color .15s ease; }
button:hover { border-color:#dfcdb8; background:#fff; }
button:active { transform:translateY(1px); }
button.on { background:var(--ink); border-color:var(--ink); color:#ffeede; }
.ember { position:absolute; border-radius:50%; pointer-events:none; animation:rise 900ms ease-out forwards; }
@keyframes rise {
  0%   { opacity:1; transform:translateY(0) scale(.6); }
  100% { opacity:0; transform:translateY(-80px) scale(1.1); }
}
footer { margin-top:32px; font-size:12px; color:var(--muted); text-align:center; line-height:1.7; max-width:640px; }
code { background:#fff; border:1px solid var(--line); border-radius:6px; padding:1px 5px; font-size:11.5px; }

.fpet-stage { display: inline-block; transform-origin: bottom center; }
.fpet-stage--lg { transform: scale(1.4); }
.fpet-stage--sm { transform: scale(0.75); }

/* jump / attack / hurt / happy are one-shots: switch back to
   .fpet--idle on the animationend event (see the demo). */

.fpet--idle { animation: fpet-idle 1144ms steps(8, end) infinite; }

.fpet--walk { animation: fpet-walk 800ms steps(8, end) infinite; }

.fpet--run { animation: fpet-run 568ms steps(8, end) infinite; }

.fpet--jump { animation: fpet-jump 664ms steps(8, end) 1; }

.fpet--attack { animation: fpet-attack 616ms steps(8, end) 1; }

.fpet--hurt { animation: fpet-hurt 728ms steps(8, end) 1; }

.fpet--sleep { animation: fpet-sleep 2000ms steps(8, end) infinite; }

.fpet--happy { animation: fpet-happy 888ms steps(8, end) 1; }

@keyframes fpet-idle {
  from { background-position: 0 0px; }
  to   { background-position: -2400px 0px; }
}

@keyframes fpet-walk {
  from { background-position: 0 -240px; }
  to   { background-position: -2400px -240px; }
}

@keyframes fpet-run {
  from { background-position: 0 -480px; }
  to   { background-position: -2400px -480px; }
}

@keyframes fpet-jump {
  from { background-position: 0 -720px; }
  to   { background-position: -2400px -720px; }
}

@keyframes fpet-attack {
  from { background-position: 0 -960px; }
  to   { background-position: -2400px -960px; }
}

@keyframes fpet-hurt {
  from { background-position: 0 -1200px; }
  to   { background-position: -2400px -1200px; }
}

@keyframes fpet-sleep {
  from { background-position: 0 -1440px; }
  to   { background-position: -2400px -1440px; }
}

@keyframes fpet-happy {
  from { background-position: 0 -1680px; }
  to   { background-position: -2400px -1680px; }
}


@media (prefers-reduced-motion: reduce) {
  .fpet { animation: none !important; background-position: 0 0; }
}

</style>
</head>
<body>
<header>
  <h1>PokeCharm &middot; fire pet</h1>
  <p>Leg-driven walk, and a fire breath attack straight from the mouth.</p>
</header>

<div class="stage">
  <div class="state">state <b id="label">idle</b></div>
  <div class="pet-wrap" id="wrap"><div class="fpet fpet--idle" id="pet"></div></div>
</div>
<p class="hint">Tip: press <b>1</b>-<b>8</b> for an animation, <b>space</b> to pet, <b>F</b> to breathe fire.</p>

<div class="row" id="buttons"></div>

<footer>
  Sheet <code>ember-sheet.png</code> - 2400&times;1920, 8&times;8 cells of 300&times;240,
  anchor (150,&nbsp;208). Styles <code>ember.css</code>, data <code>ember-atlas.json</code>.
</footer>

<script>
const NAMES = ["idle", "walk", "run", "jump", "attack", "hurt", "sleep", "happy"];
const ONESHOT = ["jump", "attack", "hurt", "happy"];
const pet = document.getElementById('pet');
const label = document.getElementById('label');
const wrap = document.getElementById('wrap');
const buttons = document.getElementById('buttons');
const stage = document.querySelector('.stage');
let current = 'idle';

function play(name) {
  current = name;
  pet.className = 'fpet fpet--' + name;
  label.textContent = name;
  [...buttons.children].forEach(b => b.classList.toggle('on', b.dataset.name === name));
}
pet.addEventListener('animationend', () => { if (ONESHOT.includes(current)) play('idle'); });

NAMES.forEach((n, i) => {
  const b = document.createElement('button');
  b.textContent = (i + 1) + '. ' + n;
  b.dataset.name = n;
  b.onclick = () => play(n);
  buttons.appendChild(b);
});

function petIt() {
  play('happy');
  for (let i = 0; i < 6; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    const s = 4 + Math.random() * 5;
    e.style.width = s + 'px'; e.style.height = s + 'px';
    e.style.left = (200 + Math.random() * 160) + 'px';
    e.style.top = (230 + Math.random() * 60) + 'px';
    e.style.background = i % 3 ? '#ffb01f' : '#ff6a1f';
    e.style.animationDelay = (i * 70) + 'ms';
    stage.appendChild(e);
    setTimeout(() => e.remove(), 1200 + i * 70);
  }
}
wrap.addEventListener('click', petIt);
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); petIt(); }
  if (e.key.toLowerCase() === 'f') { play('attack'); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 8) play(NAMES[n - 1]);
});
play('idle');
</script>
</body>
